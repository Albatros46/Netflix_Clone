spring.application.name=Netflix-Clone
server.port=${SERVER_PORT:8086}

# PostgreSQL (docker-compose.yml -> localhost:5433, Datenbank netflix_clone)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/netflix_clone}
spring.datasource.username=${DB_USERNAME:netflix}
spring.datasource.password=${DB_PASSWORD:netflix}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1

file.upload.video-dir=${UPLOAD_VIDEO_DIR:upload/videos}
file.upload.image-dir=${UPLOAD_IMAGE_DIR:upload/images}

# Mail: lokal faengt Mailpit alle E-Mails ab (Web-UI http://localhost:8027).
# Fuer echtes Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME, MAIL_PASSWORD (App-Passwort),
# MAIL_SMTP_AUTH=true und MAIL_STARTTLS=true als Umgebungsvariablen setzen - Passwoerter nie committen.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1027}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
app.mail.from=${MAIL_FROM:no-reply@netflix-clone.local}

# Frontend (Links in E-Mails, CORS)
app.frontend.url=${FRONTEND_URL:http://localhost:5175}
app.cors.allowedOrigins=${CORS_ORIGINS:http://localhost:5175}

# JWT (mindestens 32 Zeichen)
jwt.secret=${JWT_SECRET:buSuperGucluVe32KarakterdenFazlaOlanBirAnahtar1234567890}

# Beispieldaten (Admin, Benutzer, Filme) - idempotent, laeuft bei jedem Start
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-email=${ADMIN_EMAIL:admin@netflix.local}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}

management.endpoints.web.exposure.include=health
